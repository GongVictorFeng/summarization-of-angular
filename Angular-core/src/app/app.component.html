<div class="top-menu">
  <img
    class="logo"
    src="https://angular-academy.s3.amazonaws.com/main-logo/main-page-logo-small-hat.png"
  />
</div>

<ng-template [ngIf]="courses[0]">
  <div class="courses">
    <course-card
      [highlighted]="false"
      #highlighter="hl"
      (toggleHighlight)="onToggle($event)"
      (courseSelected)="onCourseSelected($event)"
      [course]="courses[0]"
    >
      <!-- pass course image as the content of the course card  -->
      <course-image
        class="course-image"
        [src]="courses[0].iconUrl"
        *ngxUnless="!courses[0].iconUrl"
      ></course-image>

      <div class="course-description" (dblclick)="highlighter.toggle()">
        {{ courses[0].longDescription }}
      </div>
    </course-card>
  </div>
</ng-template>
